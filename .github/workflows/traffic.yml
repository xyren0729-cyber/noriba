# 通学時間帯に JR西日本の運行情報を取り、遅れがあれば traffic.json を更新する（サイト版のりばが読む）
name: traffic
on:
  schedule:
    - cron: "*/10 20-23 * * *"   # 日本時間 5〜8時台
    - cron: "*/10 6-10 * * *"    # 日本時間 15〜19時台
  workflow_dispatch:
permissions:
  contents: write
concurrency: traffic
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -I tools/jrw_traffic.py traffic.json
      - run: |
          git config user.name "noriba-bot"
          git config user.email "noriba-bot@users.noreply.github.com"
          git add traffic.json
          git diff --cached --quiet || (git commit -m "運行情報を更新" && git push)
